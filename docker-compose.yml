services:
  migrate:
    image: ${OLIO_IMAGE:-ghcr.io/OWNER/olio-web:latest}
    restart: "no"
    env_file:
      - .env.production
    working_dir: /migrate
    command:
      [
        "node",
        "node_modules/migrate-mongo/bin/migrate-mongo.js",
        "up",
        "-f",
        "migrate-mongo-config.cjs",
      ]
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${OLIO_IMAGE:-ghcr.io/OWNER/olio-web:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pool-indexer:
    image: ${OLIO_IMAGE:-ghcr.io/OWNER/olio-web:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      OLIO_BASE_URL: http://web:3000
    command: ["node", "web/scripts/pool-indexer.mjs"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "web/scripts/pool-indexer.mjs", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cctp-settlement:
    image: ${OLIO_IMAGE:-ghcr.io/OWNER/olio-web:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      OLIO_BASE_URL: http://web:3000
    command: ["node", "web/scripts/cctp-worker.mjs"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "web/scripts/cctp-worker.mjs", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  verification-reconciliation:
    image: ${OLIO_IMAGE:-ghcr.io/OWNER/olio-web:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      OLIO_BASE_URL: http://web:3000
    command: ["node", "web/scripts/verification-worker.mjs"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "web/scripts/verification-worker.mjs", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
